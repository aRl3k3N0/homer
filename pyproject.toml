[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homer"
version = "1.0.0"
description = "Консольный фреймворк в стиле Laravel Artisan"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "PyYAML>=6.0",
    "psycopg2-binary>=2.9.0",
    "Jinja2>=3.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
oracle = ["cx_Oracle>=8.3.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["lib"]
omit = ["tests/*", "*/__init__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers --timeout=60"
timeout_func_only = true
markers = [
    "slow: медленные тесты (пропустить: -m 'not slow')",
    "integration: интеграционные тесты (требуют БД/сеть)",
    "benchmark: бенчмарки (запускаются отдельно)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers --timeout=60"
timeout_func_only = true
markers = [
    "slow: медленные тесты",
    "integration: интеграционные тесты",
    "benchmark: бенчмарки",
]

[tool.benchmark]
min_rounds = 20
max_time = 1.0
min_time = 0.1
warmup = true
warmup_iterations = 3
disable_gc = true
timer = "time.perf_counter"

[project]
name = "homer"
version = "1.0.0"       # будет обновляться semantic-release
description = "Консольный фреймворк в стиле Laravel Artisan"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Homer contributors"}]
keywords = ["cli", "artisan", "scheduler", "queue", "notifications", "cron"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/<user>/homer"
Documentation = "https://<user>.github.io/homer/"
Changelog = "https://github.com/<user>/homer/blob/main/CHANGELOG.md"
Issues = "https://github.com/<user>/homer/issues"

# ─────────── python-semantic-release ───────────
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["lib/__init__.py:__version__"]
branch = "main"
tag_format = "v{version}"
commit_parser = "conventional"
upload_to_vcs_release = true
changelog_file = "CHANGELOG.md"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
build_command = ""

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build", "chore", "ci", "docs", "feat", "fix", "perf",
    "refactor", "style", "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0     # без явного типа — без релиза

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "chore\\(release\\):.*",
    "^Merge branch.*",
    "^Merge pull request.*",
]
