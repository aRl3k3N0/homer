[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homer"
version = "0.1.0"
description = "Console framework in the spirit of Artisan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "aRl3k3N0" }]
keywords = ["cli", "scheduler", "queue", "notifications", "cron"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=6.0.3",
    "psycopg2-binary>=2.9.13",
    "Jinja2>=3.0.0",
    "requests>=2.32",
]

[project.scripts]
homer = "homer.cli:main"

[project.optional-dependencies]
oracle = ["cx_Oracle>=8.3.0"]
postgres = ["psycopg2-binary>=2.9.13"]
mysql = ["PyMySQL>=1.1.0"]
mssql = ["pyodbc>=4.0.0", "pymssql>=2.3.0"]
clickhouse = ["clickhouse-driver>=0.2.6", "clickhouse-connect>=0.7.0"]
redis = ["redis>=5.0"]
mongo = ["pymongo>=4.10"]
database = [
    "cx_Oracle>=8.3.0",
    "psycopg2-binary>=2.9.13",
    "PyMySQL>=1.1.0",
    "pyodbc>=4.0.0",
    "pymssql>=2.3.0",
    "clickhouse-driver>=0.2.6",
    "clickhouse-connect>=0.7.0",
    "redis>=5.0",
    "pymongo>=4.10",
]
webui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-benchmark>=4.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/aRl3k3N0/homer"
Documentation = "https://aRl3k3N0.github.io/homer/"
Changelog = "https://github.com/aRl3k3N0/homer/blob/main/CHANGELOG.md"
Issues = "https://github.com/aRl3k3N0/homer/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["homer*"]
exclude = ["tests*", "benchmarks*"]

[tool.setuptools.package-data]
homer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers --timeout=120"
asyncio_mode = "auto"
timeout_func_only = true
markers = [
    "slow: медленные тесты",
    "integration: требуют дочерних процессов",
    "webui: FastAPI TestClient",
    "contracts: OpenAPI-контракты",
    "unit: обычные unit-тесты",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/tests/*", "*/__init__.py"]

[tool.benchmark]
min_rounds = 20
max_time = 1.0
min_time = 0.1
warmup = true
warmup_iterations = 3
disable_gc = true
timer = "time.perf_counter"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/homer/__init__.py:__version__"]
branch = "main"
tag_format = "v{version}"
commit_parser = "conventional"
upload_to_vcs_release = true
changelog_file = "CHANGELOG.md"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
build_command = ""

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build", "chore", "ci", "docs", "feat", "fix", "perf",
    "refactor", "style", "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "chore\\(release\\):.*",
    "^Merge branch.*",
    "^Merge pull request.*",
]
