{% extends "base.html" %}
{% block title %}Nodes — Homer{% endblock %}
{% block content %}

<div class="d-flex align-items-center mb-3 gap-2">
  <h3 class="mb-0">Cluster nodes</h3>
  <button class="btn btn-sm btn-outline-secondary" id="btn-reload">Reload</button>
  <div class="form-check form-switch ms-3">
    <input class="form-check-input" type="checkbox" id="show-dead">
    <label class="form-check-label" for="show-dead">Show dead</label>
  </div>
  <span id="status" class="text-muted small ms-auto"></span>
</div>

<div id="alert" class="d-none"></div>

<table class="table table-sm table-hover align-middle">
  <thead class="table-light">
    <tr>
      <th>Status</th>
      <th>Hostname</th>
      <th>IP</th>
      <th>Role</th>
      <th>Version</th>
      <th>Uptime</th>
      <th>Last seen</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="nodes-body"></tbody>
</table>

<script>
(function () {
  const $ = id => document.getElementById(id);

  function fmtUptime(sec) {
    if (sec == null) return '—';
    sec = Math.floor(sec);
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.floor(sec / 60) + 'm';
    if (sec < 86400) return Math.floor(sec / 3600) + 'h' + Math.floor((sec % 3600) / 60) + 'm';
    return Math.floor(sec / 86400) + 'd' + Math.floor((sec % 86400) / 3600) + 'h';
  }

  function fmtAgo(iso) {
    if (!iso) return '—';
    const t = new Date(iso).getTime();
    const d = Math.floor((Date.now() - t) / 1000);
    if (d < 60) return d + 's ago';
    if (d < 3600) return Math.floor(d / 60) + 'm ago';
    if (d < 86400) return Math.floor(d / 3600) + 'h ago';
    return Math.floor(d / 86400) + 'd ago';
  }

  function statusBadge(n) {
    const age = n.last_seen ? (Date.now() - new Date(n.last_seen).getTime()) / 1000 : 1e9;
    if (age < 120) return '<span class="badge bg-success">alive</span>';
    if (age < 3600) return '<span class="badge bg-warning text-dark">stale</span>';
    return '<span class="badge bg-secondary">dead</span>';
  }

  function showAlert(msg, kind = 'success') {
    const el = $('alert');
    el.className = 'alert alert-' + kind;
    el.textContent = msg;
    setTimeout(() => { el.className = 'd-none'; }, 4000);
  }

  async function load() {
    const include_dead = $('show-dead').checked;
    const r = await fetch('/api/admin/nodes?include_dead=' + include_dead);
    if (!r.ok) {
      $('status').textContent = `HTTP ${r.status}`;
      return;
    }
    const nodes = await r.json();
    $('status').textContent = `${nodes.length} nodes`;

    const tbody = $('nodes-body');
    tbody.innerHTML = '';
    for (const n of nodes) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${statusBadge(n)}</td>
        <td><b>${escapeHtml(n.hostname || '—')}</b><br>
            <span class="text-muted small">${escapeHtml(n.id.slice(0, 8))}</span></td>
        <td>${escapeHtml(n.ip || '—')}</td>
        <td><span class="badge bg-info text-dark">${escapeHtml(n.role || 'worker')}</span></td>
        <td>${escapeHtml(n.version || '—')}</td>
        <td>${fmtUptime(n.uptime_seconds)}</td>
        <td>${fmtAgo(n.last_seen)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-secondary" data-act="ping" data-id="${n.id}">Ping</button>
          <button class="btn btn-sm btn-outline-info" data-act="diag" data-id="${n.id}">Diag</button>
          <button class="btn btn-sm btn-outline-primary" data-act="role" data-id="${n.id}">Set role</button>
          <button class="btn btn-sm btn-outline-warning" data-act="restart" data-id="${n.id}">Restart</button>
          <button class="btn btn-sm btn-outline-danger" data-act="shutdown" data-id="${n.id}">Shutdown</button>
        </td>
      `;
      tbody.appendChild(tr);
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  document.getElementById('nodes-body').addEventListener('click', async (ev) => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;

    if (act === 'ping') {
      const r = await fetch(`/api/admin/nodes/${id}/ping`, {method: 'POST'});
      const data = await r.json();
      showAlert(`${id.slice(0,8)} ping: ${data.ok ? 'OK' : 'FAIL'} — ${data.message}`,
                data.ok ? 'success' : 'warning');
    } else if (act === 'role') {
      const role = prompt('New role (primary|worker|read-only):', 'worker');
      if (!role) return;
      const r = await fetch(`/api/admin/nodes/${id}/role`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({role}),
      });
      if (r.ok) {
        showAlert(`Role updated to ${role}`);
        load();
      } else {
        showAlert(await r.text(), 'danger');
      }
    } else if (act === 'shutdown') {
      if (!confirm('Request graceful shutdown of this node?')) return;
      const r = await fetch(`/api/admin/nodes/${id}/shutdown`, {method: 'POST'});
      if (r.ok) {
        showAlert('Shutdown requested');
      }
    } else if (act === 'diag') {
  const r = await fetch(`/api/admin/nodes/${id}/diagnostics`);
  if (!r.ok) {
    showAlert(await r.text(), 'danger');
    return;
  }
  const d = await r.json();
  showDiagnostics(d);
} else if (act === 'restart') {
  const mode = prompt('Restart mode (soft|hard):', 'soft');
  if (!mode) return;
  const r = await fetch(`/api/admin/nodes/${id}/restart`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({mode}),
  });
  if (r.ok) {
    showAlert(`Restart requested (${mode})`);
  } else {
    showAlert(await r.text(), 'danger');
  }
}


  });

  $('btn-reload').addEventListener('click', load);
  $('show-dead').addEventListener('change', load);

  load();
  setInterval(load, 5000);
})();


function showDiagnostics(d) {
  const w = window.open('', '_blank', 'width=900,height=700');
  const html = `
    <!DOCTYPE html><html><head><meta charset="utf-8">
    <title>Diagnostics — ${escapeHtml(d.hostname || '')}</title>
    <style>
      body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; padding: 1rem; }
      h2 { margin-top: 0; }
      h3 { margin-top: 1rem; }
      pre { background: #1e1e1e; color: #d4d4d4; padding: .75rem; border-radius: 6px;
            overflow: auto; max-height: 40vh; font-size: .85em; }
      table { border-collapse: collapse; }
      td, th { border: 1px solid #dee2e6; padding: .25rem .5rem; }
    </style></head><body>
    <h2>Diagnostics: ${escapeHtml(d.hostname || '?')}</h2>
    <table>
      <tr><th>Node ID</th><td>${escapeHtml(d.node_id || '—')}</td></tr>
      <tr><th>Role</th><td>${escapeHtml(d.role || '—')}</td></tr>
      <tr><th>PID</th><td>${d.pid ?? '—'}</td></tr>
      <tr><th>Python</th><td>${escapeHtml(d.python_version || '—')}</td></tr>
      <tr><th>Started at</th><td>${escapeHtml(d.started_at || '—')}</td></tr>
      <tr><th>WS subscribers</th><td>${d.cluster_ws?.subscribers ?? '—'}</td></tr>
      <tr><th>i18n cache</th><td>${d.i18n?.cache_size ?? '—'} (misses: ${d.i18n?.cache_misses ?? 0})</td></tr>
    </table>

    <h3>Queue</h3>
    <pre>${escapeHtml(JSON.stringify(d.queue || {}, null, 2))}</pre>

    <h3>Scheduler</h3>
    <pre>${escapeHtml(JSON.stringify(d.scheduler || {}, null, 2))}</pre>

    <h3>Logs (tail 50)</h3>
    <pre>${escapeHtml((d.logs || []).join('\\n'))}</pre>
    </body></html>
  `;
  w.document.write(html);
  w.document.close();
}
</script>

{% endblock %}
