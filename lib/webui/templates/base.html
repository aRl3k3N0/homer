<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Homer Queue{% endblock %}</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <style>
    body { padding-top: 1rem; }
    .stat-card { min-width: 130px; }
    pre { max-height: 500px; overflow: auto; background: #f8f9fa; padding: 1rem; }
    .badge-status { font-size: 0.85em; }
    td.args { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .table-sm td, .table-sm th { vertical-align: middle; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">⚙️ Homer Queue</a>
    <div class="navbar-nav ms-auto">
  <a class="nav-link" href="/">Задачи</a>
  <a class="nav-link" href="/logs">Логи</a>
  <a class="nav-link" href="/console">Консоль</a>
  <a class="nav-link" href="/docs" target="_blank" rel="noopener">API</a>
        <a class="nav-link" href="/history">История</a>
</div>
      <a class="nav-link" href="?lang=ru">RU</a>
<a class="nav-link" href="?lang=en">EN</a>
  </div>
</nav>

<main class="container-fluid">
  {% block content %}{% endblock %}
</main>

<script src="/static/htmx.min.js" defer></script>
  <script src="/static/jquery-4.0.0.min.js" defer></script>
  <script src="/static/popper.min.js" defer></script>
  <script src="/static/bootstrap.min.js" defer></script>
</body>
</html>
