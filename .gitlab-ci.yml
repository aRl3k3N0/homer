# ─────────────────────────────────────────────────────────────
# GitLab CI для Homer
# Вся логика — в scripts/*.sh (единый source of truth).
# ─────────────────────────────────────────────────────────────

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]/i
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(feature|fix|hotfix|release)\/.+/
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash curl
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip/, .cache/homer/]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PROJECT_ROOT: "$CI_PROJECT_DIR"

stages: [lint, typecheck, test, benchmark, docs, package, docker, publish, release, pages, notify]

# ─────────── Lint ───────────
lint:ruff:
  stage: lint
  script: ["./scripts/lint.sh"]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(feature|fix)\/.+/

# ─────────── Typecheck ───────────
typecheck:mypy:
  stage: typecheck
  script: ["./scripts/typecheck.sh"]

# ─────────── Test ───────────
.test-base: &test-base
  stage: test
  script:
    - FAST=1 ./scripts/test.sh

test:py3.9:  {<<: *test-base, image: python:3.9-slim}
test:py3.10: {<<: *test-base, image: python:3.10-slim}
test:py3.11: {<<: *test-base, image: python:3.11-slim}
test:py3.12: {<<: *test-base, image: python:3.12-slim}

test:coverage:
  stage: test
  image: python:3.11-slim
  script:
    - COVERAGE=1 ./scripts/test.sh
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    paths: [coverage.xml, htmlcov/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ─────────── Benchmark ───────────
benchmark:
  stage: benchmark
  script:
    - COMPARE="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ./scripts/benchmark.sh
  artifacts:
    when: always
    paths: [benchmark.json, .benchmarks/]

# ─────────── Docs ───────────
docs:
  stage: docs
  script: ["./scripts/docs.sh"]
  artifacts:
    paths: [docs/api-generated/_build/html]

# ─────────── Package ───────────
package:
  stage: package
  script: ["./scripts/package.sh"]
  artifacts:
    paths: [dist/]

# ─────────── Docker ───────────
docker:build:
  stage: docker
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash curl
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        PUSH=1 LOGIN=1 \
        REGISTRY="$CI_REGISTRY" \
        IMAGE_OWNER="$CI_PROJECT_PATH" \
        IMAGE="homer" \
        REGISTRY_USER="$CI_REGISTRY_USER" \
        REGISTRY_TOKEN="$CI_REGISTRY_PASSWORD" \
        ./scripts/docker.sh
      else
        ./scripts/docker.sh
      fi
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual

# ─────────── Publish ───────────
publish:pypi:
  stage: publish
  id_tokens:
    PYPI_ID_TOKEN: {aud: pypi}
  script: ["./scripts/publish.sh"]
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG

# ─────────── Release ───────────
release:
  stage: release
  variables: {GIT_DEPTH: "0"}
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@$CI_SERVER_HOST"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - GH_TOKEN="$GITLAB_TOKEN" ./scripts/release.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# ─────────── Pages ───────────
pages:
  stage: pages
  script:
    - ./scripts/docs.sh BUILD_DIR=public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────── Notify ───────────
notify:
  stage: notify
  when: always
  script:
    - |
      PROVIDER=mattermost \
      STATUS="$CI_JOB_STATUS" \
      JOB_NAME="$CI_PROJECT_PATH / $CI_COMMIT_REF_NAME" \
      BUILD_URL="$CI_PIPELINE_URL" \
      BRANCH="$CI_COMMIT_REF_NAME" \
      COMMIT="$CI_COMMIT_SHORT_SHA" \
      ./scripts/notify.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

renovate:
  stage: .post
  image:
    name: ghcr.io/renovatebot/renovate:latest
    entrypoint: [""]
  script:
    - renovate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    LOG_LEVEL: info
    RENOVATE_CONFIG_FILE: renovate.json
