# ─────────────────────────────────────────────────────────────
# Homer: подключаемый GitLab CI template.
#
# Использование в дочернем проекте:
#
#   include:
#     - project: 'my-org/homer'
#       ref: main
#       file: '/.gitlab-ci-template.yml'
#
#   variables:
#     HOMER_TEMPLATE_ENABLE_LINT: "1"
#     HOMER_TEMPLATE_ENABLE_TEST: "1"
#     HOMER_TEMPLATE_PYTHON: "3.11"
#
# Доступные переменные шаблона:
#   HOMER_TEMPLATE_PYTHON           — образ Python (3.11)
#   HOMER_TEMPLATE_STAGE_LINT       — стадия lint (lint)
#   HOMER_TEMPLATE_STAGE_TYPECHECK  — стадия typecheck (typecheck)
#   HOMER_TEMPLATE_STAGE_TEST       — стадия test (test)
#   HOMER_TEMPLATE_STAGE_DOCS       — стадия docs (docs)
#   HOMER_TEMPLATE_STAGE_DOCKER     — стадия docker (docker)
#   HOMER_TEMPLATE_STAGE_RELEASE    — стадия release (release)
#   HOMER_TEMPLATE_ENABLE_LINT      — 1/0 (1)
#   HOMER_TEMPLATE_ENABLE_TYPECHECK — 1/0 (0)
#   HOMER_TEMPLATE_ENABLE_TEST      — 1/0 (1)
#   HOMER_TEMPLATE_ENABLE_DOCS      — 1/0 (0)
#   HOMER_TEMPLATE_ENABLE_DOCKER    — 1/0 (0)
#   HOMER_TEMPLATE_ENABLE_RELEASE   — 1/0 (0)
#   HOMER_TEMPLATE_SCRIPTS_DIR      — путь к scripts/ (scripts)
#   HOMER_TEMPLATE_TESTS            — путь к тестам (tests)

variables:
  HOMER_TEMPLATE_PYTHON: "3.11"
  HOMER_TEMPLATE_STAGE_LINT: "lint"
  HOMER_TEMPLATE_STAGE_TYPECHECK: "typecheck"
  HOMER_TEMPLATE_STAGE_TEST: "test"
  HOMER_TEMPLATE_STAGE_DOCS: "docs"
  HOMER_TEMPLATE_STAGE_DOCKER: "docker"
  HOMER_TEMPLATE_STAGE_RELEASE: "release"
  HOMER_TEMPLATE_ENABLE_LINT: "1"
  HOMER_TEMPLATE_ENABLE_TYPECHECK: "0"
  HOMER_TEMPLATE_ENABLE_TEST: "1"
  HOMER_TEMPLATE_ENABLE_DOCS: "0"
  HOMER_TEMPLATE_ENABLE_DOCKER: "0"
  HOMER_TEMPLATE_ENABLE_RELEASE: "0"
  HOMER_TEMPLATE_SCRIPTS_DIR: "scripts"
  HOMER_TEMPLATE_TESTS: "tests"

stages:
  - $HOMER_TEMPLATE_STAGE_LINT
  - $HOMER_TEMPLATE_STAGE_TYPECHECK
  - $HOMER_TEMPLATE_STAGE_TEST
  - $HOMER_TEMPLATE_STAGE_DOCS
  - $HOMER_TEMPLATE_STAGE_DOCKER
  - $HOMER_TEMPLATE_STAGE_RELEASE

# ─────────── Скрытые джобы ───────────

.homer-template-base:
  image: python:${HOMER_TEMPLATE_PYTHON}-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash curl
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip/, .cache/homer/]
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PROJECT_ROOT: "$CI_PROJECT_DIR"
    TESTS: "$HOMER_TEMPLATE_TESTS"

# ─────────── Lint ───────────

homer:lint:
  extends: .homer-template-base
  stage: $HOMER_TEMPLATE_STAGE_LINT
  script:
    - ./$HOMER_TEMPLATE_SCRIPTS_DIR/lint.sh
  rules:
    - if: '"$HOMER_TEMPLATE_ENABLE_LINT" != "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(feature|fix|hotfix)\/.+/

# ─────────── Typecheck ───────────

homer:typecheck:
  extends: .homer-template-base
  stage: $HOMER_TEMPLATE_STAGE_TYPECHECK
  script:
    - ./$HOMER_TEMPLATE_SCRIPTS_DIR/typecheck.sh
  rules:
    - if: '"$HOMER_TEMPLATE_ENABLE_TYPECHECK" != "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────── Test ───────────

homer:test:
  extends: .homer-template-base
  stage: $HOMER_TEMPLATE_STAGE_TEST
  script:
    - ./$HOMER_TEMPLATE_SCRIPTS_DIR/test.sh
  rules:
    - if: '"$HOMER_TEMPLATE_ENABLE_TEST" != "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^(feature|fix|hotfix)\/.+/

homer:test:coverage:
  extends: .homer-template-base
  stage: $HOMER_TEMPLATE_STAGE_TEST
  script:
    - COVERAGE=1 ./$HOMER_TEMPLATE_SCRIPTS_DIR/test.sh
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    paths: [coverage.xml, htmlcov/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: '"$HOMER_TEMPLATE_ENABLE_TEST" != "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────── Docs ───────────

homer:docs:
  extends: .homer-template-base
  stage: $HOMER_TEMPLATE_STAGE_DOCS
  script:
    - ./$HOMER_TEMPLATE_SCRIPTS_DIR/docs.sh
  artifacts:
    paths: [docs/api-generated/_build/html]
  rules:
    - if: '"$HOMER_TEMPLATE_ENABLE_DOCS" != "1"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ─────────── Docker ───────────

homer:docker:
  stage: $HOMER_TEMPLATE_STAGE_DOCKER
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash curl
  script:
    - ./$HOMER_TEMPLATE_SCRIPTS_DIR/docker.sh
  rules:
    - if: '"$HOMER_TEMPLATE_ENABLE_DOCKER" != "1"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# ─────────── Release ───────────

homer:release:
  extends: .homer-template-base
  stage: $HOMER_TEMPLATE_STAGE_RELEASE
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git bash curl
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@$CI_SERVER_HOST"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - GH_TOKEN="$GITLAB_TOKEN" ./$HOMER_TEMPLATE_SCRIPTS_DIR/release.sh
  rules:
    - if: '"$HOMER_TEMPLATE_ENABLE_RELEASE" != "1"'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
