# Конфигурация Ruff для Homer.
# https://docs.astral.sh/ruff/

target-version = "py39"
line-length = 100
src = ["lib", "tests"]
extend-exclude = [
    "docs/api-generated/_build",
    "var",
    "logs",
    "commands",
    "examples",
]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
    "PL",   # pylint
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long — покрывается formatter-ом
    "PLR0911", # слишком много return — иногда ок
    "PLR0912", # слишком много ветвлений — иногда ок
    "PLR0913", # слишком много аргументов — иногда ок
    "PLR0917", # many positional parameters are part of existing public APIs
    "PLR0915", # слишком много statements — иногда ок
    "PLR2004", # magic value — иногда удобно
    "B008",   # function call in default — нужно для DI
    "SIM108", # ternary — читаемость важнее
    "PLC0415", # local imports preserve optional dependencies and avoid cycles
    "PLW0603", # module-level registries intentionally use process-wide state
    "UP045",   # keep compatibility with the declared Python 3.9 minimum
    "UP007",   # keep compatibility with the declared Python 3.9 minimum
    "RUF001",  # Cyrillic is intentional in user-facing Russian text
    "RUF002",  # Cyrillic is intentional in Russian docstrings
    "RUF003",  # Cyrillic is intentional in Russian comments
]

[lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]  # assert и magic values в тестах — норма
"lib/commands/*" = ["PLR0913", "PLR0915"]  # команды — «толстые» функции

[lint.isort]
known-first-party = ["lib"]
combine-as-imports = true
force-sort-within-sections = true

[format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
