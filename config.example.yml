app:
  name: Homer
  version: 1.0.0

registry:
  cache: true                        # enable metadata cache
  cache_path: var/cache/registry.json

# To disable from CLI without editing config:
#   HOMER_NO_CACHE=1 ./homer <command>
# To print startup time and cache status:
#   HOMER_SHOW_TIME=1 ./homer <command>

paths:
  # Base directory of the project.
  # If not set, the parent directory of config.yml is used.
  # All other paths below are relative to this one unless absolute.
  base: /data/monitor

  # Runtime paths
  run_dir: var/run                    # PID files for services
  cache_dir: var/cache                # registry.json, config.json, i18n pickles
  log_dir: var/log                    # <command>/<date>.log
  email_out_dir: var/email            # FileTransport output (mailer file transport)

  # Project resource paths
  commands_dir: commands              # user commands
  plugins_dir: plugins                # plugins
  email_templates_dir: email          # mailer Jinja templates
  langs_dir: langs                    # i18n translations
  templates_dir: templates            # Web UI Jinja templates (in addition to lib/webui/templates)
  static_dir: static                  # Web UI static (in addition to lib/webui/static)

logging:
  level: INFO
  console: true
  format: text          # text | json
  # Политика хранения логов
  retention:
    # По умолчанию — сколько дней хранить
    default_days: 90
    # Индивидуально для команд (переопределяет default_days)
    per_command:
      webui: 30
      scheduler: 30
      notify: 60
      console: 14

tracing:
  enabled: false
  service_name: homer
  environment: production
  exporter: otlp               # otlp | jaeger | zipkin | none
  endpoint: "http://tempo:4317"  # OTLP gRPC
  sample_ratio: 1.0
  console: false
  # Для Jaeger:
  #exporter: jaeger
  #jaeger_host: localhost
  #jaeger_port: 6831

databases:
  oracle:
    host: localhost
    port: 1521
    service: ORCL
    user: cmdb
    password: secret
  postgres:
    host: localhost
    port: 5432
    database: homer_db
    user: postgres
    password: secret

mailer:
  transport: mailx                  # smtp | mailx | sendmail | file
  templates_dir: email
  from: noreply@example.com
  from_name: Homer Notifier
  default_subject: Уведомление Homer

  smtp:
    host: smtp.example.com
    port: 587
    user: your_user
    password: your_password
    use_tls: true
    use_ssl: false
    timeout: 30

  mailx:
    binary: /usr/bin/mailx
    from_arg: "-r"
    extra_args: []
    set_from_env: true

  sendmail:
    binary: /usr/sbin/sendmail
    extra_args: ["-t", "-i"]

  file:
    dir: var/mail

scheduler:
  storage: sqlite                    # sqlite | postgres | oracle
  interval: 30
  lease_seconds: 300
  heartbeat_interval: 30
  max_workers: 4
  execution_mode: threads            # threads | processes | subprocess
  job_timeout_sec: 3600              # для subprocess-режима
  cancel_children_on_fail: true

  queue_defaults:
    max_attempts: 3
    retry_delay: 60

  sqlite:
    path: var/scheduler.db

  # postgres:
  #   host: localhost
  #   port: 5432
  #   database: homer_db
  #   user: postgres
  #   password: secret

notifications:
  enabled: [log, file, mattermost]     # log | file | email | desktop | telegram | slack | mattermost | rocketchat | discord | teams

  log:
    on: [failed, timeout, canceled]
    level: warning

  file:
    path: var/notifications.jsonl

  email:
    on: [failed, timeout, canceled]
    to: [ops@example.com]
    from: noreply@example.com

  desktop:
    on: [failed, timeout]

  telegram:
    on: [failed, timeout, canceled]
    bot_token: "123456:ABC..."
    chat_ids:
      - 123456789
    parse_mode: HTML

  slack:
    on: [failed, timeout, canceled]
    webhook_url: "https://hooks.slack.com/services/XXX/YYY/ZZZ"
    channel: "#alerts"
    username: Homer

  mattermost:
    on: [failed, timeout, canceled]
    webhook_url: "https://mattermost.example.com/hooks/abc123"
    channel: "town-square"
    username: Homer
    icon_emoji: ":robot_face:"
    # icon_url: "https://example.com/homer.png"  # альтернатива emoji
    color_ok:    "#2ecc71"
    color_fail:  "#e74c3c"
    color_warn:  "#f39c12"
    mention_on_fail: "@channel"                # опционально

  rocketchat:
    on: [ failed, timeout, canceled ]
    webhook_url: "https://chat.example.com/hooks/xxxx/yyyy"
    channel: "#alerts"
    alias: Homer
    icon_emoji: ":robot:"
    attachment_color: "#e74c3c"

    discord:
      on: [ failed, timeout, canceled ]
      webhook_url: "https://discord.com/api/webhooks/xxx/yyy"
      username: Homer
      avatar_url: "https://example.com/homer.png"
      mention_on_fail: "@here"

    teams:
      on: [ failed, timeout, canceled ]
      webhook_url: "https://outlook.office.com/webhook/..."
      theme_color: "0078D4"

webui:
  enabled: true
  host: 0.0.0.0
  port: 80
  ssl:
    enabled: false
    port: 443
    cert: /etc/homer/ssl/homer.crt
    key:  /etc/homer/ssl/homer.key
    ca:  /etc/homer/ssl/ca.crt          # опционально
    redirect_http: true                  # HTTP → HTTPS 301
  auth:
    # Основной способ — cookie-сессия (страница /login)
    mode: session                         # session | basic | both
    session_lifetime: 86400
    cookie_secure: true                   # только по HTTPS
    cookie_name: homer_session
    # Фолбэк Basic (для API/CLI)
    basic_enabled: true

  providers:
    local:
      enabled: true
    ldap:
      enabled: false
      server: "ldaps://dc.example.com:636"
      bind_dn: "CN=homer,OU=Service,DC=example,DC=com"
      bind_password: "..."
      user_search_base: "OU=Users,DC=example,DC=com"
      user_filter: "(&(objectClass=user)(sAMAccountName={username}))"
      group_role_map:
        "CN=HomerAdmins,OU=Groups,DC=example,DC=com": admin
        "CN=HomerOps,OU=Groups,DC=example,DC=com": operator
      default_roles: [viewer]
    kerberos:
      enabled: false
      mode: proxy
      trusted_proxies: ["10.0.0.0/8", "127.0.0.1/32"]
      header: X-Remote-User
      default_roles: [viewer]

plugins:
  # Список включённых плагинов. "*" — включить все найденные.
  enabled: ["*"]
  # Или явно:
  # enabled: [my_plugin, another_plugin]
  # disabled: [experimental_plugin]

  # Автоприменение миграций при старте Homer
  auto_migrate: true

i18n:
  locale: ru
  fallback: en
  # Список доступных локалей для UI-селектора
  available: [en, ru]


