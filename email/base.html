<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; color: #333; }
    .header { background: #4a90e2; color: white; padding: 20px; }
    .content { padding: 20px; }
    .footer { color: #999; font-size: 12px; padding: 10px 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>{% block title %}Homer{% endblock %}</h1>
  </div>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
  <div class="footer">
    {% block footer %}Автоматическое сообщение, не отвечайте на него.{% endblock %}
  </div>
</body>
</html>
