{% extends "base.html" %}
{% block title %}{{ _('webui.profile.title') }} — Homer{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">

    <h3 class="mb-3">{{ _('webui.profile.title') }}</h3>

    <div id="msg" class="d-none"></div>

    <form id="profile-form">

      <div class="mb-3">
        <label class="form-label">{{ _('webui.profile.username') }}</label>
        <input type="text" class="form-control" id="f-username"
               value="{{ user.username }}" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ _('webui.profile.display_name') }}</label>
        <input type="text" class="form-control" id="f-display"
               value="{{ user.display_name or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">{{ _('webui.profile.email') }}</label>
        <input type="email" class="form-control" id="f-email"
               value="{{ user.email or '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">{{ _('webui.profile.locale') }}</label>
        <select class="form-select" id="f-locale">
          <option value="">{{ _('webui.profile.locale_default') }}</option>
          {% for l in locales %}
            <option value="{{ l }}"
                    {% if user.locale == l %}selected{% endif %}>
              {{ l|upper }}
            </option>
          {% endfor %}
        </select>
        <div class="form-text">{{ _('webui.profile.locale_hint') }}</div>
      </div>

      <hr class="my-4">

      <h5 class="mb-3">{{ _('webui.profile.change_password') }}</h5>

      <div class="mb-3">
        <label class="form-label">{{ _('webui.profile.current_password') }}</label>
        <input type="password" class="form-control" id="f-current"
               autocomplete="current-password">
      </div>

      <div class="mb-3">
        <label class="form-label">{{ _('webui.profile.new_password') }}</label>
        <input type="password" class="form-control" id="f-new"
               autocomplete="new-password">
        <div class="form-text">{{ _('webui.profile.new_password_hint') }}</div>
      </div>

      <div class="d-flex justify-content-end">
        <button type="submit" class="btn btn-primary">
          {{ _('webui.common.save') or 'Save' }}
        </button>
      </div>
    </form>

  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const form = $('profile-form');

  function show(msg, kind) {
    const el = $('msg');
    el.className = 'alert alert-' + kind;
    el.textContent = msg;
    setTimeout(() => { el.className = 'd-none'; }, 4000);
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();

    const body = {
      display_name: $('f-display').value,
      email: $('f-email').value,
      locale: $('f-locale').value || null,
      current_password: $('f-current').value || null,
      new_password: $('f-new').value || null,
    };

    try {
      const r = await fetch('/api/profile', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        credentials: 'same-origin',
        body: JSON.stringify(body),
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.detail || `HTTP ${r.status}`);
      }
      show('Saved. Reloading…', 'success');

      // Clear password fields
      $('f-current').value = '';
      $('f-new').value = '';

      // If locale changed, reload so the middleware picks it up
      setTimeout(() => window.location.reload(), 700);
    } catch (e) {
      show(e.message, 'danger');
    }
  });
})();
</script>

{% endblock %}
