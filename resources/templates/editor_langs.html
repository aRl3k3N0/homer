{% extends "base.html" %}
{% block title %}{{ _('webui.editor.langs') }} — Homer{% endblock %}
{% block content %}

<style>
  .lng-root { display: flex; gap: .75rem; min-height: 70vh; }
  .lng-tree, .lng-values {
    border: 1px solid #dee2e6;
    border-radius: .375rem;
    background: #fff;
    overflow: auto;
    max-height: 75vh;
  }
  .lng-tree { flex: 0 0 320px; padding: .5rem; }
  .lng-values { flex: 1 1 auto; padding: .25rem 0; }

  .lng-tree ul { list-style: none; padding-left: 1rem; margin: 0; }
  .lng-tree li { padding: 1px 0; }
  .lng-node {
    display: flex;
    align-items: center;
    gap: .35rem;
    padding: 2px 4px;
    border-radius: 4px;
    cursor: pointer;
    user-select: none;
    font-size: .9rem;
  }
  .lng-node:hover { background: #eef4ff; }
  .lng-node.selected { background: #d6e4ff; }
  .lng-toggle {
    width: 14px; height: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: .75rem; color: #666; cursor: pointer;
    flex-shrink: 0;
  }
  .lng-toggle.empty { visibility: hidden; }
  .lng-icon { color: #d4a017; flex-shrink: 0; }

  .lng-breadcrumb {
    padding: .5rem .75rem;
    border-bottom: 1px solid #dee2e6;
    background: #f8f9fa;
    font-family: Menlo, Consolas, monospace;
    font-size: .85rem;
    color: #555;
  }

  .lng-value-row {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    padding: .4rem .75rem;
    border-bottom: 1px solid #f1f3f5;
    cursor: pointer;
  }
  .lng-value-row:hover { background: #f8f9fa; }
  .lng-value-row.readonly { background: #fbfbfb; cursor: default; }
  .lng-value-row.readonly .lng-value-name { color: #6c757d; }
  .lng-value-row.status-missing { border-left: 4px solid #dc3545; }
  .lng-value-row.status-same-as-fallback { border-left: 4px solid #ffc107; }
  .lng-value-row.status-extra { border-left: 4px solid #0d6efd; }
  .lng-value-row.status-ok { border-left: 4px solid #198754; }

  .lng-value-name {
    flex: 0 0 30%;
    font-family: Menlo, Consolas, monospace;
    font-size: .9rem;
    font-weight: 500;
    color: #0d6efd;
    word-break: break-all;
  }
  .lng-value-body {
    flex: 1 1 auto;
    font-family: Menlo, Consolas, monospace;
    font-size: .9rem;
    word-break: break-word;
    color: #212529;
  }
  .lng-value-body .placeholder {
    color: #adb5bd;
    font-style: italic;
  }
  .lng-value-badge {
    flex: 0 0 auto;
    font-size: .7rem;
    padding: .1rem .4rem;
    border-radius: .25rem;
    background: #e9ecef;
    color: #495057;
    white-space: nowrap;
  }
  .lng-value-badge.layer-system { background: #e2e3e5; color: #6c757d; }
  .lng-value-badge.layer-project { background: #cfe2ff; color: #084298; }
  .lng-value-badge.layer-plugin { background: #d1e7dd; color: #0f5132; }
</style>

<div class="d-flex align-items-center mb-3 gap-2">
  <h3 class="mb-0">{{ _('webui.editor.langs') }}</h3>
  <select id="lang-select" class="form-select form-select-sm"
          style="max-width:180px"></select>
  <button class="btn btn-sm btn-outline-warning" id="btn-sync">Sync from fallback</button>
  <button class="btn btn-sm btn-outline-secondary" id="btn-reload">Reload</button>
  <span id="status" class="text-muted small"></span>
</div>

<div class="lng-root">
  <div class="lng-tree" id="tree"></div>
  <div class="lng-values">
    <div class="lng-breadcrumb" id="breadcrumb">(root)</div>
    <div id="values-list"></div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal fade" id="value-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="value-modal-title">Translation</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Key</label>
          <input type="text" class="form-control" id="vm-key" readonly>
        </div>
        <div class="mb-2">
          <label class="form-label">Fallback value</label>
          <input type="text" class="form-control" id="vm-fallback" readonly>
        </div>
        <div class="mb-2">
          <label class="form-label">Translation</label>
          <input type="text" class="form-control" id="vm-value">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="vm-save">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  let availableLocales = [];
  let fallbackLocale = 'en';
  let currentLocale = null;
  let sections = [];             // [{path, name, leaves, subsections}]
  let selectedSection = '';
  let sectionEntries = [];       // [{key, name, value, fallback, layer, status}]
  let editingKey = null;

  // ─────────── Load ───────────

  async function loadLocales() {
    const r = await fetch('/api/editor/langs', {credentials: 'same-origin'});
    const data = await r.json();
    availableLocales = data.available || [];
    fallbackLocale = data.fallback || 'en';

    const sel = $('lang-select');
    sel.innerHTML = '';
    for (const loc of availableLocales) {
      const opt = document.createElement('option');
      opt.value = loc;
      opt.textContent = loc.toUpperCase();
      if (loc === data.default) opt.selected = true;
      sel.appendChild(opt);
    }
    currentLocale = sel.value;

    sel.addEventListener('change', async () => {
      currentLocale = sel.value;
      await loadSections();
      await loadSection('');
    });
  }

  async function loadSections() {
    const r = await fetch(
      '/api/editor/langs/' + encodeURIComponent(currentLocale) + '/tree',
      {credentials: 'same-origin'},
    );
    if (!r.ok) {
      $('status').textContent = `Error loading tree: HTTP ${r.status}`;
      sections = [];
      return;
    }
    sections = await r.json();
    $('status').textContent = `Loaded ${sections.length} sections`;
    renderTree();
  }

  async function loadSection(path) {
    selectedSection = path;
    const r = await fetch(
      '/api/editor/langs/' + encodeURIComponent(currentLocale) +
      '/section?path=' + encodeURIComponent(path),
      {credentials: 'same-origin'},
    );
    if (!r.ok) {
      $('status').textContent = `Error loading section: HTTP ${r.status}`;
      sectionEntries = [];
    } else {
      const data = await r.json();
      sectionEntries = data.entries || [];
    }
    renderBreadcrumb();
    renderValues();
    updateSelectionHighlight();
  }

  // ─────────── Tree ───────────

  function renderTree() {
    const el = $('tree');
    el.innerHTML = '';

    const byParent = {};
    for (const s of sections) {
      if (!s.path) continue;
      const parent = s.path.includes('.')
        ? s.path.slice(0, s.path.lastIndexOf('.'))
        : '';
      (byParent[parent] = byParent[parent] || []).push(s);
    }
    for (const k of Object.keys(byParent)) {
      byParent[k].sort((a, b) => a.name.localeCompare(b.name));
    }

    const topLevel = byParent[''] || [];
    const rootUl = document.createElement('ul');
    rootUl.style.paddingLeft = '0';

    for (const s of topLevel) {
      rootUl.appendChild(buildTreeItem(s, byParent, 0));
    }
    el.appendChild(rootUl);

    expandPathTo(selectedSection);
  }

  function buildTreeItem(section, byParent, depth) {
    const li = document.createElement('li');

    const node = document.createElement('div');
    node.className = 'lng-node';
    node.dataset.path = section.path;
    if (section.path === selectedSection) node.classList.add('selected');

    const toggle = document.createElement('span');
    toggle.className = 'lng-toggle';
    node.appendChild(toggle);

    const icon = document.createElement('span');
    icon.className = 'lng-icon';
    icon.textContent = '🌐';
    node.appendChild(icon);

    const name = document.createElement('span');
    name.textContent = section.name;
    node.appendChild(name);

    const badge = document.createElement('span');
    badge.className = 'text-muted small ms-auto';
    badge.textContent = section.leaves;
    node.appendChild(badge);

    li.appendChild(node);

    const children = byParent[section.path] || [];
    let childrenUl = null;
    if (children.length > 0) {
      childrenUl = document.createElement('ul');
      for (const child of children) {
        childrenUl.appendChild(buildTreeItem(child, byParent, depth + 1));
      }
      li.appendChild(childrenUl);
      toggle.textContent = '▶';
      toggle.classList.remove('empty');
    } else {
      toggle.classList.add('empty');
    }

    toggle.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (!childrenUl) return;
      const open = childrenUl.style.display !== 'none';
      childrenUl.style.display = open ? 'none' : '';
      toggle.textContent = open ? '▶' : '▼';
    });

    node.addEventListener('click', (ev) => {
      ev.stopPropagation();
      loadSection(section.path);
    });

    return li;
  }

  function expandPathTo(targetPath) {
    if (!targetPath) return;
    const parts = targetPath.split('.');
    let prefix = '';
    for (let i = 0; i < parts.length - 1; i++) {
      prefix = prefix ? `${prefix}.${parts[i]}` : parts[i];
      const node = document.querySelector(
        `.lng-node[data-path="${CSS.escape(prefix)}"]`
      );
      if (node && node.parentElement) {
        const ul = node.parentElement.querySelector(':scope > ul');
        if (ul) {
          ul.style.display = '';
          const toggle = node.querySelector('.lng-toggle');
          if (toggle) toggle.textContent = '▼';
        }
      }
    }
  }

  function updateSelectionHighlight() {
    document.querySelectorAll('.lng-node').forEach((n) => {
      n.classList.toggle('selected', n.dataset.path === selectedSection);
    });
  }

  // ─────────── Breadcrumb ───────────

  function renderBreadcrumb() {
    const el = $('breadcrumb');
    el.textContent = selectedSection
      ? '/' + selectedSection.replace(/\./g, ' / ')
      : '(root)';
  }

  // ─────────── Values ───────────

  function renderValues() {
    const el = $('values-list');
    el.innerHTML = '';

    if (!sectionEntries.length) {
      const empty = document.createElement('div');
      empty.style.padding = '.75rem 1rem';
      empty.style.color = '#6c757d';
      empty.textContent = 'No keys in this section.';
      el.appendChild(empty);
      return;
    }

    for (const e of sectionEntries) {
      const readonly = (e.layer === 'system');
      const row = document.createElement('div');
      row.className = `lng-value-row status-${e.status}` +
                     (readonly ? ' readonly' : '');

      const name = document.createElement('div');
      name.className = 'lng-value-name';
      name.textContent = e.name;
      row.appendChild(name);

      const body = document.createElement('div');
      body.className = 'lng-value-body';
      if (e.value !== null && e.value !== undefined) {
        body.textContent = e.value;
      } else if (e.fallback !== null && e.fallback !== undefined) {
        const ph = document.createElement('span');
        ph.className = 'placeholder';
        ph.textContent = '— missing — (fallback: ' + e.fallback + ')';
        body.appendChild(ph);
      } else {
        body.textContent = '';
      }
      row.appendChild(body);

      const badge = document.createElement('span');
      badge.className = 'lng-value-badge layer-' + (e.layer || 'project');
      const layerLabel = e.layer === 'system' ? 'system' :
                         e.layer === 'plugin' ? 'plugin' : 'project';
      badge.textContent = layerLabel;
      row.appendChild(badge);

      if (!readonly) {
        row.addEventListener('dblclick', () => openEditModal(e));
        row.addEventListener('contextmenu', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          showValueMenu(ev, e);
        });
      } else {
        row.title = 'System translations are read-only. ' +
                    'Add/override the key in the project locale to change it.';
      }

      el.appendChild(row);
    }
  }

  // ─────────── Context menu ───────────

  function closeContext() {
    const old = document.getElementById('lng-context');
    if (old) old.remove();
  }
  document.addEventListener('click', closeContext);
  document.addEventListener('scroll', closeContext, true);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeContext();
  });

  function showContext(ev, items) {
    closeContext();
    const box = document.createElement('div');
    box.className = 'reg-context';
    box.id = 'lng-context';
    box.style.position = 'fixed';
    box.style.zIndex = 2000;
    box.style.background = '#fff';
    box.style.border = '1px solid #ccc';
    box.style.borderRadius = '.375rem';
    box.style.boxShadow = '0 6px 20px rgba(0,0,0,.15)';
    box.style.minWidth = '190px';
    box.style.padding = '.25rem 0';
    box.style.left = ev.clientX + 'px';
    box.style.top = ev.clientY + 'px';

    for (const it of items) {
      if (it.sep) {
        const sep = document.createElement('div');
        sep.style.height = '1px';
        sep.style.background = '#e9ecef';
        sep.style.margin = '.25rem 0';
        box.appendChild(sep);
        continue;
      }
      const div = document.createElement('div');
      div.style.padding = '.3rem .85rem';
      div.style.cursor = 'pointer';
      div.style.fontSize = '.875rem';
      if (it.danger) div.style.color = '#b02a37';
      div.textContent = it.label;
      div.addEventListener('mouseenter', () => {
        div.style.background = it.danger ? '#dc3545' : '#0d6efd';
        div.style.color = '#fff';
      });
      div.addEventListener('mouseleave', () => {
        div.style.background = '';
        div.style.color = it.danger ? '#b02a37' : '';
      });
      div.addEventListener('click', () => {
        closeContext();
        it.action();
      });
      box.appendChild(div);
    }
    document.body.appendChild(box);
  }

  function showValueMenu(ev, entry) {
    const items = [
      {label: 'Modify…', action: () => openEditModal(entry)},
    ];
    if (entry.value !== null && entry.value !== undefined) {
      items.push({sep: true});
      items.push({
        label: 'Delete translation',
        danger: true,
        action: () => deleteTranslation(entry),
      });
    }
    showContext(ev, items);
  }

  // ─────────── Actions ───────────

  function openEditModal(entry) {
    editingKey = entry.key;
    $('value-modal-title').textContent = entry.name;
    $('vm-key').value = entry.key;
    $('vm-fallback').value = entry.fallback ?? '(no fallback)';
    $('vm-value').value = entry.value ?? '';
    new bootstrap.Modal($('value-modal')).show();
  }

  async function saveModal() {
    if (!editingKey) return;
    const value = $('vm-value').value;
    try {
      const r = await fetch(
        '/api/editor/langs/' + encodeURIComponent(currentLocale),
        {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          body: JSON.stringify({updates: {[editingKey]: value}}),
        }
      );
      if (!r.ok) throw new Error(await r.text());
      bootstrap.Modal.getInstance($('value-modal')).hide();
      await loadSection(selectedSection);
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  async function deleteTranslation(entry) {
    if (!confirm(`Delete translation for "${entry.key}"?`)) return;
    try {
      const r = await fetch(
        '/api/editor/langs/' + encodeURIComponent(currentLocale),
        {
          method: 'PUT',
          headers: {'Content-Type': 'application/json'},
          credentials: 'same-origin',
          body: JSON.stringify({updates: {[entry.key]: null}}),
        }
      );
      if (!r.ok) throw new Error(await r.text());
      await loadSection(selectedSection);
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  async function syncFromFallback() {
    if (!confirm('Copy all missing keys from the fallback locale?')) return;
    $('status').textContent = 'Syncing…';
    try {
      const r = await fetch(
        '/api/editor/langs/' + encodeURIComponent(currentLocale) + '/sync',
        {method: 'POST', credentials: 'same-origin'},
      );
      const data = await r.json();
      $('status').textContent = `Synced ${data.synced} keys`;
      await loadSections();
      await loadSection(selectedSection);
    } catch (e) {
      $('status').textContent = 'Error: ' + e.message;
    }
  }

  // ─────────── Buttons ───────────

  $('btn-sync').addEventListener('click', syncFromFallback);
  $('btn-reload').addEventListener('click', async () => {
    await loadSections();
    await loadSection(selectedSection);
  });
  $('vm-save').addEventListener('click', saveModal);

  // ─────────── Init ───────────

  (async () => {
    await loadLocales();
    await loadSections();
    const firstTop = sections.find(s => s.path && !s.path.includes('.'));
    const initialPath = firstTop ? firstTop.path : '';
    await loadSection(initialPath);
  })();
})();
</script>

{% endblock %}
