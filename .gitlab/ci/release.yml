# ─────────── Semantic Release ───────────

release:semantic:
  stage: release
  extends: .python-setup
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - python --version
    - pip install "python-semantic-release>=9.0"
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@$CI_SERVER_HOST"
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - semantic-release version
    - semantic-release publish
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual           # включайте вручную первое время
      allow_failure: true

# Публикация в PyPI (по тегу)
release:pypi:
  stage: publish
  extends: .python-setup
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    - pip install twine
    - twine upload --repository pypi dist/* --non-interactive
  needs: [package:build]
  rules:
    - if: $CI_COMMIT_TAG

# GitLab Release (создаёт страницу релиза)
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Создание GitLab Release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Homer $CI_COMMIT_TAG"
    description: "./CHANGELOG.md"
  rules:
    - if: $CI_COMMIT_TAG
