# ─────────── Docker ───────────

docker:build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_BUILDKIT: "1"
    IMAGE_REPO: "$CI_REGISTRY_IMAGE"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      docker buildx create --use --name homer-builder 2>/dev/null || true
      docker buildx inspect --bootstrap
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="-t $IMAGE_REPO:$CI_COMMIT_TAG \
              -t $IMAGE_REPO:${CI_COMMIT_TAG%.*} \
              -t $IMAGE_REPO:${CI_COMMIT_TAG%%.*} \
              -t $IMAGE_REPO:latest"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="-t $IMAGE_REPO:edge -t $IMAGE_REPO:sha-$CI_COMMIT_SHORT_SHA"
      else
        TAGS="-t $IMAGE_REPO:$CI_COMMIT_REF_SLUG"
      fi
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --push \
        $TAGS .
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true

# Публикация в GHCR как альтернатива GitLab Registry
docker:ghcr:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_BUILDKIT: "1"
  before_script:
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="-t ghcr.io/$GHCR_USER/homer:$CI_COMMIT_TAG -t ghcr.io/$GHCR_USER/homer:latest"
      else
        TAGS="-t ghcr.io/$GHCR_USER/homer:edge"
      fi
      docker buildx build --platform linux/amd64,linux/arm64 --push $TAGS .
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: [package:build]
