# ─────────── Тесты (Linux, matrix Python) ───────────

.test-template: &test-template
  stage: test
  extends: .python-setup
  script:
    - python -m pytest -q --maxfail=1 --timeout=60
    - |
      if [ "$CI_NODE_INDEX" = "0" ]; then
        python -m pytest --cov=lib --cov-report=term-missing \
          --cov-report=xml:coverage.xml --cov-report=html:htmlcov \
          --cov-fail-under=40
      fi
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    when: always
    paths:
      - coverage.xml
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: junit.xml
    expire_in: 1 week

test:py3.9:
  <<: *test-template
  image: python:3.9-slim

test:py3.10:
  <<: *test-template
  image: python:3.10-slim

test:py3.11:
  <<: *test-template
  image: python:3.11-slim

test:py3.12:
  <<: *test-template
  image: python:3.12-slim

# ─────────── Тесты на macOS / Windows (по тегу/ручному запуску) ───────────

test:macos:
  stage: test-ext
  tags:
    - saas-macos-medium-m1       # или свой раннер с macOS
  image: macos-14-xcode-15
  before_script:
    - python3 --version
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - python -m pytest -q --maxfail=1 --timeout=60
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"

test:windows:
  stage: test-ext
  tags:
    - saas-windows-medium-amd64
  image: windows-server-2022
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - python -m pytest -q --maxfail=1 --timeout=60
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"

# ─────────── Интеграционные тесты с БД (опционально) ───────────

test:postgres:
  stage: test
  extends: .python-setup
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: homer_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    PGHOST: postgres
    PGPORT: 5432
  script:
    - |
      cat > config.yml <<EOF
      databases:
        postgres:
          host: postgres
          port: 5432
          database: homer_test
          user: postgres
          password: postgres
      scheduler:
        storage: postgres
        postgres:
          host: postgres
          port: 5432
          database: homer_test
          user: postgres
          password: postgres
      notifications:
        enabled: []
      EOF
    - python -m pytest -q -m integration --timeout=120
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
