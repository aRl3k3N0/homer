# ─────────── Wheel / sdist ───────────

package:build:
  stage: package
  extends: .python-setup
  script:
    - pip install build
    - python -m build
  artifacts:
    name: "dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.whl
      - dist/*.tar.gz
    expire_in: 1 month
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
