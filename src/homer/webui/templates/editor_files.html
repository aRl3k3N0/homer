{% extends "base.html" %}
{% block title %}{{ category }} — {{ _('webui.nav.editor') }}{% endblock %}
{% block content %}

<div class="d-flex align-items-center mb-3 gap-2">
  <h3 class="mb-0">{{ _('webui.editor.' ~ category) | default(category) }}</h3>
  <code class="ms-2 text-muted">{{ category }}</code>
  <button class="btn btn-sm btn-outline-primary ms-auto" id="btn-new-file">New file</button>
  <button class="btn btn-sm btn-outline-secondary" id="btn-new-dir">New folder</button>
</div>

<div id="tree" class="border rounded p-2"
     style="max-height:75vh;overflow:auto;font-size:.9rem"></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const category = {{ category | tojson }};
  let currentPath = '';

  async function loadTree(path) {
    currentPath = path || '';
    const r = await fetch(`/api/editor/tree/${category}?path=${encodeURIComponent(currentPath)}`);
    const items = await r.json();
    const el = $('tree');
    el.innerHTML = '';

    if (currentPath) {
      const up = document.createElement('div');
      up.style.padding = '4px 8px';
      up.style.cursor = 'pointer';
      up.textContent = '⬆ ..';
      up.addEventListener('click', () => {
        const parent = currentPath.split('/').slice(0, -1).join('/');
        loadTree(parent);
      });
      el.appendChild(up);
    }

    for (const item of items) {
      const div = document.createElement('div');
      div.style.padding = '4px 8px';
      div.style.cursor = 'pointer';
      div.style.borderRadius = '4px';

      const icon = item.type === 'dir' ? '📁' : '📄';
      div.textContent = `${icon} ${item.name}`;
      if (item.type === 'file') {
        div.textContent += ` (${item.size} B)`;
      }

      div.addEventListener('mouseenter', () => div.style.background = '#f0f0f0');
      div.addEventListener('mouseleave', () => div.style.background = '');

      if (item.type === 'dir') {
        div.addEventListener('click', () => loadTree(item.path));
      } else {
        div.addEventListener('click', () => {
          window.location.href = `/editor/files/${category}/${item.path}`;
        });
      }
      el.appendChild(div);
    }
  }

  $('btn-new-file').addEventListener('click', async () => {
    const name = prompt('File name (e.g. my_command.py):');
    if (!name) return;
    const path = currentPath ? `${currentPath}/${name}` : name;
    const r = await fetch(`/api/editor/file/${category}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path, content: '', create: true}),
    });
    if (!r.ok) {
      alert('Error: ' + await r.text());
      return;
    }
    loadTree(currentPath);
  });

  $('btn-new-dir').addEventListener('click', async () => {
    const name = prompt('Folder name:');
    if (!name) return;
    const path = currentPath ? `${currentPath}/${name}` : name;
    const r = await fetch(`/api/editor/mkdir/${category}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path}),
    });
    if (!r.ok) {
      alert('Error: ' + await r.text());
      return;
    }
    loadTree(currentPath);
  });

  loadTree('');
})();
</script>

{% endblock %}
