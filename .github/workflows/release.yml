name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # для push в main (CHANGELOG, version)
  id-token: write       # для OIDC (если пригодится)
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Защита от зацикливания: не запускать на коммитах от самого себя
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # semantic-release нужна вся история
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка python-semantic-release
        run: |
          python -m pip install --upgrade pip
          pip install "python-semantic-release>=9.0"

      - name: Настройка git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version
          semantic-release publish

      - name: Итог
        if: always()
        run: |
          if git describe --tags --abbrev=0 2>/dev/null; then
            echo "Последний тег: $(git describe --tags --abbrev=0)"
          fi
          echo "Ветка: ${{ github.ref_name }}"
          echo "SHA:   ${{ github.sha }}"
