name: Benchmark

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      compare_branch:
        description: 'С какой веткой сравнивать'
        required: false
        default: 'main'

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (Python 3.11)
    runs-on: ubuntu-latest
    permissions:
      contents: write         # для push в gh-pages (графики)
      pull-requests: write    # для комментария в PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Кэш бенчмарков
        uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmark-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            benchmark-${{ github.ref_name }}-
            benchmark-

      - name: Запуск бенчмарков
        run: |
          python -m pytest benchmarks/ \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-storage=.benchmarks \
            --benchmark-json=benchmark.json

      - name: Сравнение с базовой веткой
        if: github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.inputs.compare_branch || 'main' }}
          python -m pytest benchmarks/ \
            --benchmark-only \
            --benchmark-compare="^$BASE" \
            --benchmark-storage=.benchmarks \
            --benchmark-compare-fail=mean:20% || true

      - name: Сохранить benchmark.json
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark.json
          retention-days: 30

      - name: Сгенерировать HTML-графики
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Homer benchmark
          tool: pytest
          output-file-path: benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          comment-on-alert: true
          alert-threshold: '130%'       # 30% регрессии — алерт
          fail-on-alert: true
          alert-comment-cc-users: '@${{ github.actor }}'
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks
